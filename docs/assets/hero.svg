<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="capi-ops — monitoreo y control de flota Coolify y WAHA por Telegram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="55%" stop-color="#101014"/>
      <stop offset="100%" stop-color="#18100e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c65d3b"/>
      <stop offset="100%" stop-color="#d9694a"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <circle cx="1110" cy="40" r="180" fill="#c65d3b" fill-opacity="0.10"/>
  <circle cx="60" cy="290" r="150" fill="#c65d3b" fill-opacity="0.06"/>

  <!-- texto -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="96" fill="#9a9aa2" font-size="13" letter-spacing="3.4" font-weight="600">MONITOREO · ALERTAS · ACCIONES</text>
    <text x="62" y="166" fill="#f7f6f4" font-size="62" font-weight="800" letter-spacing="-1.5">capi-ops</text>
    <text x="64" y="204" fill="#cfcdc9" font-size="19">Flota Coolify + WAHA vigilada 24/7, con un bot que además ejecuta.</text>
    <text x="64" y="246" fill="#8d8d96" font-size="14" letter-spacing="1.2">NODE 24 · TYPESCRIPT · SQLITE · MCP · TELEGRAM</text>
    <rect x="64" y="262" width="92" height="4" rx="2" fill="url(#accent)"/>
  </g>

  <!-- diagrama -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- servidores -->
    <g fill="#15151b" stroke="#2a2a33">
      <rect x="628" y="66"  width="128" height="36" rx="9"/>
      <rect x="628" y="132" width="128" height="36" rx="9"/>
      <rect x="628" y="198" width="128" height="36" rx="9"/>
    </g>
    <g fill="#b9b7b2" font-size="13" text-anchor="middle">
      <text x="692" y="89">Coolify</text>
      <text x="692" y="155">Coolify</text>
      <text x="692" y="221">Coolify</text>
    </g>

    <!-- conexiones -->
    <g stroke="#c65d3b" stroke-opacity="0.55" stroke-width="1.6" fill="none">
      <path d="M756 84 C 786 84, 786 140, 812 146"/>
      <path d="M756 150 H 812"/>
      <path d="M756 216 C 786 216, 786 160, 812 154"/>
      <path d="M952 150 H 1000"/>
    </g>

    <!-- nucleo -->
    <rect x="812" y="104" width="140" height="92" rx="16" fill="#141019" stroke="url(#accent)" stroke-width="1.8" filter="url(#glow)"/>
    <text x="882" y="140" fill="#f7f6f4" font-size="17" font-weight="700" text-anchor="middle">capi-ops</text>
    <text x="882" y="162" fill="#c65d3b" font-size="11" letter-spacing="1.6" text-anchor="middle">WATCHER + BOT</text>
    <text x="882" y="180" fill="#7d7d87" font-size="10" text-anchor="middle">MCP · métricas · reglas</text>

    <!-- telegram -->
    <rect x="1000" y="126" width="136" height="48" rx="24" fill="#1b1417" stroke="#c65d3b" stroke-width="1.4"/>
    <text x="1068" y="147" fill="#f0eeeb" font-size="14" font-weight="600" text-anchor="middle">Telegram</text>
    <text x="1068" y="163" fill="#8d8d96" font-size="10" text-anchor="middle">alertas y comandos</text>
  </g>
</svg>
